services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmacy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: pharmacy_user
      POSTGRES_PASSWORD: pharmacy_pass
    ports:
      - "5433:5432"
    volumes:
      - pharmacy_pgdata:/var/lib/postgresql/data

volumes:
  pharmacy_pgdata:
